services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-compta}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # accès local uniquement (ex. Prisma Studio) ; jamais exposé publiquement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-compta}
    volumes:
      - app_documents:/app/.data/documents
      - app_uploads:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000" # accès local uniquement (debug) ; le trafic public passe par Caddy via le réseau ci-dessous
    networks:
      - default
      - caddy_net

# Utilisation :
#   cp .env.example .env                 # POSTGRES_* pour ce fichier
#   cp .env.example apps/web/.env        # variables applicatives (voir docs/DEPLOYMENT.md)
#   docker compose up -d --build
# La première migration (prisma migrate deploy) tourne automatiquement au
# démarrage du conteneur app (voir apps/web/Dockerfile).
#
# `caddy_net` doit pointer vers le réseau Docker du Caddy déjà en place sur
# le VPS (ex. n8n-docker_default — voir `docker network ls` et le
# docker-compose.yml existant du reverse proxy). Caddy joint alors ce
# conteneur `app` par son nom de service (voir Caddyfile.snippet), comme il
# le fait déjà pour n8n.

networks:
  caddy_net:
    external: true
    name: n8n-docker_default

volumes:
  db_data:
  app_documents:
  app_uploads:
